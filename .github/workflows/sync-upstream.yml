
name: Sync Original Author

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch original repository
        run: |
          git remote add upstream https://github.com/ColinDargent/forward-unipile.git
          git fetch upstream main

      - name: Update mirror
        run: |
          git push --force origin FETCH_HEAD:refs/heads/upstream-main
