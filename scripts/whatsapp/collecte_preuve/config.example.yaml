# ÉCRITURE : simulée par défaut (UNIPILE_DRY_RUN=1). Garde-fous plafond + fenêtre locale + jitter.
# RÉCEPTION de la pièce jointe : via webhook (voir E2 accountability et A1/inbox temps réel).

preuve_type: "photo_ou_audio"   # "photo", "audio" ou "photo_ou_audio" (valeur par défaut)

coaches:
