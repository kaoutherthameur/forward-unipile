    country: "FR"
    exercice_du_jour: "10 pompes + 5 min de respiration"
    preuve_type: "photo"
  - prenom: "Thomas"
    chat_id: "c-3002"
    country: "FR"
    exercice_du_jour: "lire 10 pages de ton livre"
    preuve_type: "audio"
  - prenom: "Sofia"
    chat_id: "c-3003"
    country: "BE"
    exercice_du_jour: "préparer ta boîte-repas de midi"
